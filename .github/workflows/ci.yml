name: CI

on:
  push:
    branches: [main]
  # Every PR, including PRs stacked on another feature branch
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux (build, lint, test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Installs the Swift toolchain pinned in mise.toml
      - uses: jdx/mise-action@v5

      - uses: actions/cache@v6
        with:
          path: .build
          key: spm-linux-${{ hashFiles('mise.toml', 'Package.swift', 'Package.resolved') }}
          restore-keys: spm-linux-

      - run: swift --version && swiftlint version
      - name: Lint (swift-format + SwiftLint, strict)
        run: mise run lint
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: CLI smoke test
        run: |
          swift run remi --version
          swift run remi --help
          swift run remi completions bash
          # No EventKit on Linux: Reminders commands fail with a structured error
          set +e
          swift run remi --json lists 2> err.json
          status=$?
          set -e
          cat err.json
          test "$status" -eq 1
          grep -q '"success": false' err.json

  macos:
    name: macOS (release build, test)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      # Installs the Swift toolchain pinned in mise.toml (swift.org .pkg); the SDK comes from the runner's Xcode.
      - uses: jdx/mise-action@v5

      - uses: actions/cache@v6
        with:
          path: .build
          key: spm-macos-${{ hashFiles('mise.toml', 'Package.swift', 'Package.resolved') }}
          restore-keys: spm-macos-

      - run: |
          sw_vers
          xcode-select -p
          which swift
          swift --version
          swiftlint version
      - name: Lint (swift-format + SwiftLint, strict)
        run: mise run lint
      - name: Build (release, embedded Info.plist, ad-hoc signed)
        run: scripts/build-release.sh
      - name: Verify Info.plist and signature
        run: |
          launchctl plist __TEXT,__info_plist .build/release/remi
          launchctl plist __TEXT,__info_plist .build/release/remi | grep -q NSRemindersFullAccessUsageDescription
          launchctl plist __TEXT,__info_plist .build/release/remi | grep -q io.github.neo-the-on3.remi
          codesign -dv --verbose=2 .build/release/remi 2>&1 | tee codesign.txt
          grep -q "Identifier=io.github.neo-the-on3.remi" codesign.txt
          grep -q "Signature=adhoc" codesign.txt
      - name: Test
        run: swift test
      - name: CLI smoke test
        run: |
          .build/release/remi --version
          .build/release/remi --help
          # Argument checks run before Reminders is touched
          set +e
          .build/release/remi delete Inbox Milk 2> err.txt
          status=$?
          set -e
          cat err.txt
          test "$status" -eq 1
          grep -q "Deletion requires --confirm flag" err.txt
      - name: Doctor (informational; the runner has no Reminders permission, so access checks fail)
        continue-on-error: true
        run: |
          # doctor never prompts, but cap it in case EventKit blocks on a headless runner
          perl -e 'alarm 60; exec @ARGV' .build/release/remi doctor || true
      - uses: actions/upload-artifact@v7
        with:
          name: remi-macos
          path: .build/release/remi
          if-no-files-found: error
