name: CI

on:
  push:
    branches: [main]
  # Every PR, including PRs stacked on another branch
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux (build, lint, test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Installs the Swift toolchain and SwiftLint pinned in mise.toml
      - uses: jdx/mise-action@v5

      - uses: actions/cache@v6
        with:
          path: .build
          key: spm-linux-${{ hashFiles('mise.toml', 'Package.swift', 'Package.resolved') }}
          restore-keys: spm-linux-

      # zsh and fish let the completion tests syntax-check every generated script; the section reader links SQLite
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh fish libsqlite3-dev
      - run: swift --version && swiftlint version
      - name: Lint (swift-format + SwiftLint, strict)
        run: mise run lint
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: CLI smoke test
        run: |
          swift run reminders --version
          swift run reminders --help
          swift run reminders completions zsh > reminders.zsh && zsh -n reminders.zsh
          # Usage errors exit 64
          set +e
          swift run reminders completions powershell
          test $? -eq 64 || exit 1
          # Without Apple Reminders, commands fail with a structured error and exit 1
          swift run reminders --json lists 2> err.json
          status=$?
          set -e
          cat err.json
          test "$status" -eq 1
          grep -q '"success" : false' err.json
          grep -q '"code" : "UNSUPPORTED_PLATFORM"' err.json
      - name: MCP smoke test (stdio)
        run: |
          scripts/mcp-session.sh "" reminders_move '{"list":"Inbox","title":"Milk"}' reminders_lists '{}' | tee mcp.jsonl
          test "$(wc -l < mcp.jsonl)" -eq 4
          test "$(grep -o '"name":"reminders_[a-z_]*"' mcp.jsonl | wc -l)" -eq 16
          grep -q 'INVALID_ARGUMENT' mcp.jsonl
          grep -q 'UNSUPPORTED_PLATFORM' mcp.jsonl

  macos:
    name: macOS (release build, test)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      # Installs the Swift toolchain pinned in mise.toml (swift.org .pkg); the SDK comes from the runner's Xcode.
      - uses: jdx/mise-action@v5

      - uses: actions/cache@v6
        with:
          path: .build
          key: spm-macos-${{ hashFiles('mise.toml', 'Package.swift', 'Package.resolved') }}
          restore-keys: spm-macos-

      - run: |
          sw_vers
          xcode-select -p
          which swift
          swift --version
          swiftlint version
      - name: Lint (swift-format + SwiftLint, strict)
        run: mise run lint
      - name: Build (release, embedded Info.plist, ad-hoc signed)
        run: scripts/build-release.sh
      - name: Verify Info.plist and signature
        run: |
          binary=.build/release/reminders
          launchctl plist __TEXT,__info_plist "$binary" | tee plist.txt
          grep -q NSRemindersFullAccessUsageDescription plist.txt
          grep -q io.github.neo-the-on3.reminders plist.txt
          codesign -dv --verbose=2 "$binary" 2>&1 | tee codesign.txt
          grep -q "Identifier=io.github.neo-the-on3.reminders" codesign.txt
          grep -q "Signature=adhoc" codesign.txt
      - name: Test
        run: swift test
      - name: CLI smoke test
        run: |
          .build/release/reminders --version
          .build/release/reminders --help
          .build/release/reminders completions zsh > reminders.zsh && zsh -n reminders.zsh
          # Argument checks run before Reminders is touched
          set +e
          .build/release/reminders delete Inbox Milk 2> err.txt
          status=$?
          set -e
          cat err.txt
          test "$status" -eq 1
          grep -q "Deletion requires --confirm flag" err.txt
      - name: MCP smoke test (stdio; no store calls, the runner has no Reminders permission)
        run: |
          scripts/mcp-session.sh .build/release/reminders reminders_move '{"list":"Inbox","title":"Milk"}' | tee mcp.jsonl
          test "$(wc -l < mcp.jsonl)" -eq 3
          test "$(grep -o '"name":"reminders_[a-z_]*"' mcp.jsonl | wc -l)" -eq 16
          grep -q 'INVALID_ARGUMENT' mcp.jsonl
      - name: Doctor (informational; the runner has no Reminders permission)
        continue-on-error: true
        run: |
          # doctor never prompts, but cap it in case EventKit blocks on a headless runner
          perl -e 'alarm 60; exec @ARGV' .build/release/reminders doctor || true
      - uses: actions/upload-artifact@v7
        with:
          name: reminders-macos
          path: .build/release/reminders
          if-no-files-found: error
